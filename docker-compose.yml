services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reservas
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./auth_info:/app/auth_info   # persiste la sesión de WhatsApp
      - ./logs:/app/logs             # persiste los logs
    restart: unless-stopped

volumes:
  pgdata:
